[pytest]
# ============================================================
# 1. БАЗОВЫЕ НАСТРОЙКИ
# ============================================================


# Добавляем корневую папку в PYTHONPATH
pythonpath = ./
# Пути, где pytest ищет тесты (по умолчанию и так tests/, но явно лучше)
testpaths = tests

# Файлы, которые pytest считает тестами
python_files = test_*.py *_test.py *_tests.py
python_classes = Test*
python_functions = test_*

# ============================================================
# 2. ПАРАМЕТРЫ ЗАПУСКА ПО УМОЛЧАНИЮ
# ============================================================

# addopts применяются при каждом запуске pytest (без дополнительных флагов)
addopts = 
    # -v: подробный вывод (видно имена тестов)
    -v
    # -s: не перехватывать stdout/print (полезно для отладки)
    -s
    # --tb=short: короткий traceback (не засорять лог)
    --tb=short
    # --strict-markers: ошибка, если использован незарегистрированный маркер
    --strict-markers
    # --maxfail=1: остановить после первого падения (в CI экономит время)
    --maxfail=1
    # --disable-warnings: отключить предупреждения (чистый вывод)
    --disable-warnings
    # -p no:cacheprovider: отключить кэширование (для чистоты в CI)
    -p no:cacheprovider

# ============================================================
# 3. МАРКЕРЫ (обязательно для --strict-markers)
# ============================================================

markers =
    # Группировка по типу тестов
    unit: Тесты на уровне отдельных классов/функций (быстрые)
    integration: Тесты, требующие БД, API, файловой системы
    e2e: End-to-end тесты (медленные, полные сценарии)
    smoke: Дымовые тесты (критические пути)
    regression: Регрессионные тесты (полный набор)
    performance: Нагрузочные/производительные тесты
    
    # Скорость выполнения
    slow: Медленные тесты (> 1 секунды)
    fast: Быстрые тесты (< 100ms)
    
    # Стабильность
    flaky: Нестабильные тесты (требуют retry)
    critical: Критические тесты (блокирующие релиз)

# ============================================================
# 4. НАСТРОЙКИ ЛОГИРОВАНИЯ
# ============================================================

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S